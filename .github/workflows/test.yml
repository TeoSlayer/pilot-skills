name: Test Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run skill tests
        run: bash test-skills.sh

      - name: Run Muse installer and pilot-sandbox script tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash tests/muse-frontmatter.test.sh
          bash tests/muse-install.test.sh
          bash tests/pilot-up.test.sh
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Generate skills catalog
        run: bash generate-catalog.sh

      - name: Generate setups catalog
        run: bash generate-setups.sh

      - name: Commit catalogs if changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet skills.json setups.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills.json setups.json
          git commit -m "Update skills.json and setups.json catalogs"
          # Rebase before push to handle the race with build-pilotctl-skill,
          # which can land its own auto-commit between our checkout and push.
          for attempt in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                  exit 0
              fi
              echo "push attempt $attempt rejected, retrying..."
              sleep 2
          done
          echo "push failed after 3 attempts" >&2
          exit 1

  # Released pilot-daemons fetch inject-manifest.json from main at runtime.
  # Run the skill injector versions they ship against this checkout's
  # manifest: it must still be accepted, keep injecting the regular tools,
  # and ignore keys only newer injectors read (gatedTools).
  released-skillinject:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skillinject:
          - v0.2.2
          - v0.2.3
          - v0.2.4-0.20260717204101-902f745138da # pilot v1.13.2 .. v1.13.10-rc.1
          - v0.2.4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/released-skillinject/go.mod
          cache: false

      - name: Released skillinject accepts inject-manifest.json
        working-directory: tests/released-skillinject
        env:
          GOWORK: "off"
        run: |
          go get github.com/pilot-protocol/skillinject@${{ matrix.skillinject }}
          go list -m github.com/pilot-protocol/skillinject
          go test -count=1 -v ./...
