name: build-pilotctl-skill

# Rebuilds skills/pilotctl/SKILL.md from ONBOARDING.md plus the catalog of
# the skills listed in inject-manifest.json's referencedSkills, then signs
# inject-manifest.json and every file it makes pilot-daemon fetch
# (SIGNING.md) with the pilot-skills key from the SKILLS_SIGNING_KEY
# secret, and commits the rebuilt file and the .sig files to main.
#
# It runs on every push to main, not only on pushes that touch the
# signed files, so a change to any file the manifest lists is signed by
# the run of the push that made it. Signing is deterministic: when
# nothing changed the run commits nothing.
#
# On pull requests it only rebuilds SKILL.md, without the key, to show
# that the generator still runs; the PR is signed when it merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. Each run signs main as it is when the run starts
# its attempt, so a queued run replacing another loses nothing.
concurrency:
  group: build-pilotctl-skill-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The skillinject version whose cmd/sign-skills signs the content.
  SIGN_SKILLS_VERSION: v0.2.6-beta.2.0.20261108205954-2a44696e9ce4

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild skills/pilotctl/SKILL.md
        run: bash build-pilotctl-skill.sh

      - name: Show what main will get
        run: |
          if git diff --quiet -- skills/pilotctl/SKILL.md; then
            echo "skills/pilotctl/SKILL.md is unchanged."
          else
            echo "On merge, CI commits this rebuilt skills/pilotctl/SKILL.md and signs it:"
            git diff --stat -- skills/pilotctl/SKILL.md
          fi

  build-and-sign:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/signatures/go.mod
          cache: false

      - name: Install sign-skills
        env:
          GOWORK: "off"
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install "github.com/pilot-protocol/skillinject/cmd/sign-skills@${SIGN_SKILLS_VERSION}"
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Rebuild, sign and commit
        env:
          SKILLS_SIGNING_KEY: ${{ secrets.SKILLS_SIGNING_KEY }}
          GOWORK: "off"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Sign main as it is now, so content pushed while this run
            # waited is signed too.
            git fetch -q origin main
            git reset -q --hard origin/main

            # The generator does not need the key; keep it out of its env.
            env -u SKILLS_SIGNING_KEY bash build-pilotctl-skill.sh

            # sign-skills reads the key from the environment and never
            # prints it. It refuses a key other than the daemon's built-in
            # one.
            sign-skills sign -repo . -key-env SKILLS_SIGNING_KEY
            env -u SKILLS_SIGNING_KEY sign-skills verify -repo .
            # The same check with tests/signatures' own copy of the rules.
            (cd tests/signatures && env -u SKILLS_SIGNING_KEY go test -count=1 ./...)

            git add -A -- skills/pilotctl/SKILL.md ':(glob)**/*.sig'
            if git diff --cached --quiet; then
              echo "Everything was already signed; nothing to commit."
              exit 0
            fi
            git diff --cached --stat
            git commit -q -m "Rebuild skills/pilotctl/SKILL.md and sign the injected files"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt rejected, signing again on the new main..."
            sleep 2
          done
          echo "push failed after 3 attempts" >&2
          exit 1
